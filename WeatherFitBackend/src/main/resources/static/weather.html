<!-- src/main/resources/static/weather.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>실시간 날씨</title>
</head>
<body>
<h1>현재 기온</h1>
<p id="result">불러오는 중...</p>

<script>
    // 날짜, 시간 계산
    const now = new Date();
    const yyyy = now.getFullYear();
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const dd = String(now.getDate()).padStart(2, '0');
    const hh = String(now.getHours()).padStart(2, '0') + "00";

    const baseDate = `${yyyy}${mm}${dd}`;
    const baseTime = hh;
    const nx = "60"; // 서울
    const ny = "127";

    fetch(`/weather/temperature?baseDate=${baseDate}&baseTime=${baseTime}&nx=${nx}&ny=${ny}`)
        .then(res => res.json())
        .then(data => {
            document.getElementById("result").innerText =
                `기온: ${data.temperature} (시간: ${data.time}, 날짜: ${data.date})`;
        })
        .catch(err => {
            document.getElementById("result").innerText = "불러오기 실패";
            console.error(err);
        });
</script>
</body>
</html>
