<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>날씨 기반 코디 추천</title>
</head>
<body>
<h1>날씨 기반 코디 추천</h1>

<!-- 1. 주소 + 날씨기준 검색 폼 -->
<form action="/weather/search" method="get" style="padding: 10px; margin-top: 20px; display: flex; align-items: center;">
    <label>지역:
        <input type="text" name="address" placeholder="예: 서울시 강남구"
               th:value="${address}" required style="margin-left: 10px;">
    </label>
    <label>날씨 기준:
        <select name="forecastType" style="margin-left: 10px;">
            <option value="today" th:selected="${forecastType == 'today'}">오늘 날씨</option>
            <option value="tomorrow" th:selected="${forecastType == 'tomorrow'}">내일 날씨</option>
        </select>
    </label>
    <button type="submit" style="padding: 5px 10px; border-radius: 5px; margin-left: 20px;">날씨 조회 🔍</button>
</form>

<!-- 2. 성별 선택 + 코디 추천 폼 -->
<form action="/recommend/auto" method="get" style="padding: 10px; display: flex; align-items: center; margin-top: 20px;">
    <label>성별:
        <select name="gender" style="margin-left: 10px;">
            <option value="MALE">남자</option>
            <option value="FEMALE">여자</option>
        </select>
    </label>
    <button type="submit" style="padding: 5px 10px; border-radius: 5px; margin-left: 20px;">코디 추천 👕</button>
</form>

<hr>

<!-- 3. 최신화된 날씨 정보 -->
<div th:if="${weatherData != null}">
    <h2 th:if="${address != null and forecastType != null}"
        th:text="|${address}의 ${#strings.equals(forecastType, 'today') ? '오늘 날씨' : '내일 날씨'}|">
    </h2>

    <p>
        최고 기온: <span th:text="${weatherData.maxTemperature}"></span>°C /
        최저 기온: <span th:text="${weatherData.minTemperature}"></span>°C
    </p>

    <p>
        평균 기온: <span th:text="${weatherData.avgTemperature}"></span>°C
    </p>

    <p>
        현재 날씨 상태: <span th:text="${weatherData.mainWeather}"></span>
    </p>
</div>

<hr>

<!-- 4. 코디 추천 결과 -->

<!-- BEST 배너 -->
<div th:if="${bestClothes != null}">
    <h2>⭐ BEST 코디 추천</h2>
    <ul>
        <li th:each="clothes : ${bestClothes}">
            <p>카테고리: <span th:text="${clothes.category}"></span></p>
            <p>이름: <span th:text="${clothes.name}"></span></p>
            <p>좋아요: <span th:text="${clothes.likes}"></span></p>
            <img th:src="${clothes.imageUrl}" alt="옷 이미지" width="150">
            <hr>
        </li>
    </ul>
</div>

<!-- 추천(Random) 배너 -->
<div th:if="${randomClothes != null}">
    <h2>🎲 랜덤 코디 추천</h2>
    <ul>
        <li th:each="clothes : ${randomClothes}">
            <p>카테고리: <span th:text="${clothes.category}"></span></p>
            <p>이름: <span th:text="${clothes.name}"></span></p>
            <img th:src="${clothes.imageUrl}" alt="옷 이미지" width="150">
            <hr>
        </li>
    </ul>
</div>

<!-- 아우터 배너 -->
<div th:if="${outerClothes != null}">
    <h2>🧥 아우터 추천</h2>
    <div th:if="${#strings.isEmpty(outerClothes) == false}">
        <ul>
            <li th:each="clothes : ${outerClothes}">
                <p>이름: <span th:text="${clothes.name}"></span></p>
                <img th:src="${clothes.imageUrl}" alt="아우터 이미지" width="150">
                <hr>
            </li>
        </ul>
    </div>
    <p th:if="${outerClothes instanceof T(java.lang.String)}" th:text="${outerClothes}"></p>
</div>

<!-- 상의 배너 -->
<div th:if="${topClothes != null}">
    <h2>👕 상의 추천</h2>
    <ul>
        <li th:each="clothes : ${topClothes}">
            <p>이름: <span th:text="${clothes.name}"></span></p>
            <img th:src="${clothes.imageUrl}" alt="상의 이미지" width="150">
            <hr>
        </li>
    </ul>
</div>

<!-- 하의 배너 -->
<div th:if="${bottomClothes != null}">
    <h2>👖 하의 추천</h2>
    <ul>
        <li th:each="clothes : ${bottomClothes}">
            <p>이름: <span th:text="${clothes.name}"></span></p>
            <img th:src="${clothes.imageUrl}" alt="하의 이미지" width="150">
            <hr>
        </li>
    </ul>
</div>

</body>
</html>
