<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>날씨 기반 코디 추천</title>
</head>
<body>
<h1>날씨 기반 코디 추천</h1>

<form action="/weather/search" method="get">
    <label>지역:
        <input type="text" name="address" placeholder="예: 서울시 강남구" required>
    </label>
    <br><br>
    <label>날씨 기준:
        <select name="forecastType">
            <option value="today">오늘 날씨</option>
            <option value="tomorrow">내일 날씨</option>
        </select>
    </label>
    <br><br>
    <button type="submit">날씨 조회</button>
</form>

<hr>

<h2>날씨 정보</h2>

<div th:if="${weatherData != null}">
    <p>최저 기온: <span th:text="${weatherData.minTemperature}">최저 기온</span>°C</p>
    <p>최고 기온: <span th:text="${weatherData.maxTemperature}">최고 기온</span>°C</p>

    <table border="1">
        <thead>
        <tr>
            <th>시간</th>
            <th>기온 (°C)</th>
            <th>날씨 상태</th>
            <th>강수/적설량</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="hourly : ${weatherData.hourlyWeather}">
            <td th:text="${#temporals.format(hourly.dateTime, 'MM/dd HH시')}"></td>
            <td th:text="${hourly.temperature}"></td>
            <td th:text="${hourly.weatherDescription}"></td>
            <td th:text="${hourly.precipitation != null ? hourly.precipitation : '-'}"></td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
